name: nexo
on:
  push: { paths: ["nexo/**"] }
  pull_request: { paths: ["nexo/**"] }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: nexo } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: nexo/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
        env: { NEXT_PUBLIC_SUPABASE_URL: "http://localhost:54321", NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci" }
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16 postgresql-16-pgvector
      - run: sudo -E bash nexo/tests/sql/run.sh
