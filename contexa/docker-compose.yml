# Sobe o Contexa no servidor. Segredos ficam no arquivo .env (fora do Git).
services:
  contexa:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # exposto só para o proxy reverso (nginx/Caddy com HTTPS)
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
